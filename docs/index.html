<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stride – Build habits that stick</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F7F8FA;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .bolt {
      font-size: 56px;
      margin-bottom: 16px;
    }
    .name {
      font-size: 42px;
      font-weight: 800;
      color: #4A6CF7;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 20px;
      color: #6B7280;
      margin-bottom: 36px;
      max-width: 380px;
    }
    .badge {
      display: inline-block;
      background: #111827;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 14px;
      margin-bottom: 40px;
      letter-spacing: 0.2px;
    }
    .badge:hover { background: #374151; }
    .links { display: flex; gap: 24px; font-size: 14px; }
    .links a { color: #4A6CF7; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="bolt">⚡</div>
  <div class="name">Stride</div>
  <p class="tagline">Build habits that stick — one day, one streak at a time.</p>
  <!-- Update href with real App Store URL after approval -->
  <a class="badge" href="https://apps.apple.com" target="_blank">
    Download on the App Store
  </a>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="mailto:wcwatson22@gmail.com">Support</a>
  </div>

</html>
