workflows:

  # ── iOS App Store build ────────────────────────────────────────────────────
  ios-release:
    name: iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.strideapp.habittracker
      vars:
        XCODE_SCHEME: Stride
        ASC_KEY_ID: 24DJNHQWAS
        ASC_ISSUER_ID: 55a91748-0078-45c8-ae86-f98d86a83c88
        # Base64-encoded App Store Connect private key (AuthKey_24DJNHQWAS.p8)
        # Same key as Clarity — reuse the same ASC_PRIVATE_KEY_B64 env var in Codemagic dashboard
        ASC_PRIVATE_KEY_B64: $ASC_PRIVATE_KEY_B64
      node: 22.13.0
      xcode: 16.2

    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps

      - name: Run Expo prebuild (generates native iOS project)
        script: npx expo prebuild --platform ios --clean

      - name: Set build number
        script: |
          cd ios
          xcrun agvtool new-version -all $BUILD_NUMBER

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/Stride.xcworkspace" \
            --scheme "$XCODE_SCHEME"

      - name: Upload to TestFlight
        script: |
          mkdir -p ~/.private_keys
          echo "$ASC_PRIVATE_KEY_B64" | base64 -D > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  # ── Android Play Store build ───────────────────────────────────────────────
  android-release:
    name: Android — Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - stride_keystore
      vars:
        PACKAGE_NAME: com.strideapp.habittracker
      node: 22.13.0
      java: 17

    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps

      - name: Run Expo prebuild (generates native Android project)
        script: npx expo prebuild --platform android --clean

      - name: Build Android release AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

