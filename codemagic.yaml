workflows:

  # ── iOS App Store build ────────────────────────────────────────────────────
  ios-release:
    name: iOS — App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.strideapp.habittracker
      vars:
        XCODE_SCHEME: Stride
        # ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY_B64 are set in
        # Codemagic → Environment variables (encrypted) — never commit them here
      node: 22.13.0
      xcode: latest

    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps

      - name: Run Expo prebuild (generates native iOS project)
        script: npx expo prebuild --platform ios --clean

      - name: Patch ExpoModulesJSI xcframework build phase
        script: |
          # This script replaces the ExpoModulesJSI xcframework build phase with a no-op.
          # The phase fails on CI because it tries to build for simulator during a device-only archive.
          python3 << 'PYEOF'
          import re, os

          path = 'ios/Pods/Pods.xcodeproj/project.pbxproj'
          if not os.path.exists(path):
              print("Pods project not found — skipping patch")
              exit(0)

          with open(path, 'r') as f:
              content = f.read()

          # Find the shellScript value for the ExpoModulesJSI build phase and replace with exit 0
          patched = re.sub(
              r'(/\* \[CP-User\] Build ExpoModulesJSI xcframework \*/[^;]*shellScript = )"[^"]*(?:\\.[^"]*)*"',
              r'\1"exit 0\\n"',
              content,
              flags=re.DOTALL
          )

          if patched != content:
              with open(path, 'w') as f:
                  f.write(patched)
              print("Successfully patched ExpoModulesJSI build phase")
          else:
              print("ExpoModulesJSI pattern not found — no patch needed")
          PYEOF

      - name: Set build number
        script: |
          cd ios
          xcrun agvtool new-version -all $BUILD_NUMBER

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/Stride.xcworkspace" \
            --scheme "$XCODE_SCHEME"

      - name: Upload to TestFlight
        script: |
          mkdir -p ~/.private_keys
          echo "$ASC_PRIVATE_KEY_B64" | base64 --decode > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 2>/dev/null \
            || echo "$ASC_PRIVATE_KEY_B64" | base64 -D > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          if [ ! -s ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 ]; then
            echo "ERROR: AuthKey file is empty — check ASC_PRIVATE_KEY_B64 env var"
            exit 1
          fi

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  # ── Android Play Store build ───────────────────────────────────────────────
  android-release:
    name: Android — Play Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - stride_keystore
      vars:
        PACKAGE_NAME: com.strideapp.habittracker
      node: 22.13.0
      java: 17

    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps

      - name: Run Expo prebuild (generates native Android project)
        script: npx expo prebuild --platform android --clean

      - name: Build Android release AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
